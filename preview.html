<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PneumoAI — AI-Powered Pneumonia Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              serif: ['Playfair Display', 'Georgia', 'serif'],
            },
            colors: {
              warm: {
                50:  '#faf8f5',
                100: '#f3efe8',
                200: '#e8dfd2',
                300: '#d4c4a8',
                400: '#b89f7a',
                500: '#a08560',
                600: '#8b7050',
                700: '#725a42',
                800: '#5e4a38',
                900: '#1a1612',
                950: '#0f0d0b',
              },
            },
          },
        },
      }
    </script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #0f0d0b;
        color: #e8dfd2;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* Warm noise texture */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.02;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }

      /* Upload zone heartbeat pulse */
      .upload-ring {
        position: relative;
        border-radius: 24px;
        border: 1px solid rgba(212, 196, 168, 0.08);
        transition: border-color 0.5s ease;
      }
      .upload-ring::before {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 26px;
        border: 1px solid transparent;
        background: linear-gradient(135deg, rgba(212,196,168,0.15), rgba(139,112,80,0.08)) border-box;
        -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        opacity: 0;
        animation: heartbeat-border 3s ease-in-out infinite;
      }
      @keyframes heartbeat-border {
        0%, 100% { opacity: 0; transform: scale(1); }
        8% { opacity: 1; transform: scale(1.003); }
        16% { opacity: 0.3; transform: scale(1); }
        24% { opacity: 0.9; transform: scale(1.002); }
        35% { opacity: 0; transform: scale(1); }
      }
      /* ECG wave sweep */
      .upload-ring::after {
        content: '';
        position: absolute;
        top: -1px;
        left: 0;
        width: 200%;
        height: 2px;
        background: linear-gradient(90deg,
          transparent 0%, transparent 10%,
          rgba(212,196,168,0.0) 10%, rgba(212,196,168,0.0) 20%,
          rgba(212,196,168,0.0) 30%, rgba(212,196,168,0.4) 35%,
          rgba(212,196,168,0.0) 36%, rgba(212,196,168,0.0) 37%,
          rgba(212,196,168,0.0) 38%, rgba(212,196,168,0.8) 40%,
          rgba(212,196,168,0.0) 42%, rgba(212,196,168,0.0) 44%,
          rgba(212,196,168,0.3) 46%, rgba(212,196,168,0.0) 47%,
          rgba(212,196,168,0.0) 50%, rgba(212,196,168,0.0) 100%
        );
        background-size: 50% 100%;
        background-repeat: repeat-x;
        animation: ecg-sweep 3s linear infinite;
        filter: drop-shadow(0 0 4px rgba(212,196,168,0.3));
        border-radius: 24px 24px 0 0;
        overflow: hidden;
      }
      @keyframes ecg-sweep {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
      }

      /* ECG heartbeat draw */
      @keyframes ecg-draw {
        0% { stroke-dashoffset: 200; }
        40% { stroke-dashoffset: 0; }
        60% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }

      /* Scanning line */
      @keyframes scan {
        0% { top: -2px; opacity: 0; }
        5% { opacity: 1; }
        95% { opacity: 1; }
        100% { top: calc(100% + 2px); opacity: 0; }
      }
      .scan-line { animation: scan 2.4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

      /* Fade up */
      @keyframes fade-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-up { animation: fade-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      /* Pulse */
      @keyframes pulse-warm {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.7; }
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #3d342a; border-radius: 10px; }
    </style>
  </head>
  <body class="antialiased">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const { useState, useCallback, useRef } = React;

      /* ──────────────────────────────────────────────────────────────
         SVG ICONS
         ────────────────────────────────────────────────────────────── */
      const I = {
        Activity: ({ className, strokeWidth = 2 }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        ),
        Upload: ({ className, strokeWidth = 1.5 }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        ),
        Shield: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
          </svg>
        ),
        Zap: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
          </svg>
        ),
        Search: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
        ),
        Check: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
          </svg>
        ),
        X: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/>
          </svg>
        ),
        RotateCcw: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>
          </svg>
        ),
        Brain: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
            <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
            <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
            <path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>
            <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
            <path d="M3.477 10.896a4 4 0 0 1 .585-.396"/>
            <path d="M19.938 10.5a4 4 0 0 1 .585.396"/>
            <path d="M6 18a4 4 0 0 1-1.967-.516"/>
            <path d="M19.967 17.484A4 4 0 0 1 18 18"/>
          </svg>
        ),
        FileImage: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
            <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
            <circle cx="10" cy="13" r="2"/>
            <path d="m20 17-1.1-1.1a2 2 0 0 0-2.81 0L10 22"/>
          </svg>
        ),
        ArrowRight: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>
          </svg>
        ),
        ChevronRight: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="m9 18 6-6-6-6"/>
          </svg>
        ),
        Lungs: ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M6.081 20C3.57 20 2 18 2 16c0-2 1-3 3-4l1-1c1.5-1 3-2 3-5 0 3 1.5 4 3 5l1 1c2 1 3 2 3 4 0 2-1.57 4-4.081 4"/>
            <path d="M17.92 20C20.43 22 22 20 22 18c0-2-1-3-3-4l-1-1c-1.5-1-3-2-3-5 0 3-1.5 4-3 5l-1 1c-2 1-3 2-3 4 0 2 1.57 4 4.081 4"/>
            <path d="M12 2v20"/>
          </svg>
        ),
      };

      /* ──────────────────────────────────────────────────────────────
         ORGANIC DECORATIVE SVG — abstract lung / anatomy line art
         ────────────────────────────────────────────────────────────── */
      function AnatomyDecor({ className }) {
        return (
          <svg viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg" className={className}>
            {/* Left lung shape */}
            <path
              d="M160 120 C120 140, 80 200, 85 280 C90 340, 120 380, 150 390 C170 395, 185 380, 190 350 C195 320, 190 280, 180 250 C170 220, 165 170, 160 120Z"
              stroke="rgba(212,196,168,0.08)"
              strokeWidth="1"
              fill="none"
            />
            {/* Right lung shape */}
            <path
              d="M240 120 C280 140, 320 200, 315 280 C310 340, 280 380, 250 390 C230 395, 215 380, 210 350 C205 320, 210 280, 220 250 C230 220, 235 170, 240 120Z"
              stroke="rgba(212,196,168,0.08)"
              strokeWidth="1"
              fill="none"
            />
            {/* Trachea */}
            <path d="M200 60 L200 200" stroke="rgba(212,196,168,0.06)" strokeWidth="1" />
            {/* Bronchi branches */}
            <path d="M200 200 C180 230, 140 260, 120 300" stroke="rgba(212,196,168,0.05)" strokeWidth="0.8" />
            <path d="M200 200 C220 230, 260 260, 280 300" stroke="rgba(212,196,168,0.05)" strokeWidth="0.8" />
            {/* Small branch details */}
            <path d="M170 240 C150 260, 130 270, 110 290" stroke="rgba(212,196,168,0.04)" strokeWidth="0.5" />
            <path d="M180 270 C160 290, 140 310, 125 340" stroke="rgba(212,196,168,0.04)" strokeWidth="0.5" />
            <path d="M230 240 C250 260, 270 270, 290 290" stroke="rgba(212,196,168,0.04)" strokeWidth="0.5" />
            <path d="M220 270 C240 290, 260 310, 275 340" stroke="rgba(212,196,168,0.04)" strokeWidth="0.5" />
            {/* Rib cage hints */}
            <path d="M130 180 C160 170, 240 170, 270 180" stroke="rgba(212,196,168,0.04)" strokeWidth="0.6" fill="none" />
            <path d="M115 220 C155 208, 245 208, 285 220" stroke="rgba(212,196,168,0.04)" strokeWidth="0.6" fill="none" />
            <path d="M105 260 C150 246, 250 246, 295 260" stroke="rgba(212,196,168,0.04)" strokeWidth="0.6" fill="none" />
            <path d="M100 300 C148 284, 252 284, 300 300" stroke="rgba(212,196,168,0.04)" strokeWidth="0.6" fill="none" />
            <path d="M105 340 C150 324, 250 324, 295 340" stroke="rgba(212,196,168,0.04)" strokeWidth="0.6" fill="none" />
            {/* Heart silhouette hint */}
            <path
              d="M190 170 C185 160, 195 148, 200 148 C205 148, 215 160, 210 170 C210 180, 200 195, 200 195 C200 195, 190 180, 190 170Z"
              stroke="rgba(212,196,168,0.06)"
              strokeWidth="0.8"
              fill="rgba(212,196,168,0.02)"
            />
          </svg>
        );
      }

      /* ──────────────────────────────────────────────────────────────
         NAVBAR
         ────────────────────────────────────────────────────────────── */
      function Navbar() {
        return (
          <nav className="fixed top-0 left-0 right-0 z-50 border-b border-warm-200/[0.04] bg-warm-950/70 backdrop-blur-2xl">
            <div className="mx-auto flex h-[60px] max-w-6xl items-center justify-between px-8">
              <a href="#" className="flex items-center gap-2.5 group">
                <div className="flex h-8 w-8 items-center justify-center rounded-full bg-warm-400/15 transition-colors group-hover:bg-warm-400/25">
                  <I.Activity className="h-4 w-4 text-warm-400" strokeWidth={2} />
                </div>
                <span className="text-[15px] font-medium tracking-[-0.01em] text-warm-200">
                  Pneumo<span className="text-warm-400">AI</span>
                </span>
              </a>

              <div className="hidden items-center gap-1 md:flex">
                {['Home', 'How it Works', 'About Model'].map((link, i) => (
                  <a key={link} href="#"
                    className={`rounded-lg px-3 py-1.5 text-[13px] transition-colors ${
                      i === 0 ? 'text-warm-200 font-medium' : 'text-warm-300/40 hover:text-warm-300/70 font-normal'
                    }`}>
                    {link}
                  </a>
                ))}
              </div>

              <button className="rounded-full border border-warm-300/[0.08] bg-warm-300/[0.03] px-4 py-1.5 text-[12px] font-medium text-warm-300/50 transition-all hover:border-warm-300/[0.15] hover:bg-warm-300/[0.06] hover:text-warm-300/80">
                API Access
              </button>
            </div>
          </nav>
        );
      }

      /* ──────────────────────────────────────────────────────────────
         STAT PILL
         ────────────────────────────────────────────────────────────── */
      function StatPill({ icon: Icon, label, value }) {
        return (
          <div className="flex items-center gap-3 rounded-2xl bg-warm-200/[0.03] px-4 py-3 transition-colors hover:bg-warm-200/[0.05]">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-warm-400/[0.08]">
              <Icon className="h-4 w-4 text-warm-400/60" />
            </div>
            <div className="flex flex-col">
              <span className="text-[10px] font-semibold uppercase tracking-[0.12em] text-warm-300/25">{label}</span>
              <span className="text-[14px] font-semibold text-warm-200/70">{value}</span>
            </div>
          </div>
        );
      }

      /* ──────────────────────────────────────────────────────────────
         UPLOAD ZONE
         ────────────────────────────────────────────────────────────── */
      function UploadZone({ onFileSelect }) {
        const [isDragging, setIsDragging] = useState(false);
        const [isHovered, setIsHovered] = useState(false);
        const fileInputRef = useRef(null);

        const onDrag = useCallback((e) => { e.preventDefault(); e.stopPropagation(); }, []);
        const onDragIn = useCallback((e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); }, []);
        const onDragOut = useCallback((e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); }, []);
        const onDrop = useCallback((e) => {
          e.preventDefault(); e.stopPropagation(); setIsDragging(false);
          const f = e.dataTransfer.files?.[0];
          if (f && (f.type === 'image/jpeg' || f.type === 'image/png')) onFileSelect(f);
        }, [onFileSelect]);
        const onInput = useCallback((e) => { if (e.target.files?.[0]) onFileSelect(e.target.files[0]); }, [onFileSelect]);

        return (
          <div
            className={`relative cursor-pointer transition-transform duration-500 ease-out ${isDragging ? 'scale-[1.01]' : ''} ${isHovered ? 'scale-[1.003]' : ''}`}
            onDragEnter={onDragIn} onDragLeave={onDragOut} onDragOver={onDrag} onDrop={onDrop}
            onClick={() => fileInputRef.current?.click()}
            onMouseEnter={() => setIsHovered(true)} onMouseLeave={() => setIsHovered(false)}
          >
            {/* Warm ambient glow */}
            <div className={`absolute -inset-10 rounded-[32px] transition-opacity duration-700 ${
              isDragging ? 'opacity-100' : isHovered ? 'opacity-60' : 'opacity-30'
            }`}
              style={{ background: 'radial-gradient(ellipse at center, rgba(184,159,122,0.08), transparent 70%)' }}
            />

            <div className="upload-ring relative">
              <div className="relative flex h-[340px] flex-col items-center justify-center overflow-hidden rounded-[23px] bg-warm-950 sm:h-[380px]">

                {/* Subtle organic pattern background */}
                <div className="pointer-events-none absolute inset-0 opacity-[0.015]"
                  style={{
                    backgroundImage: 'radial-gradient(circle at 1px 1px, rgba(212,196,168,0.6) 0.5px, transparent 0)',
                    backgroundSize: '28px 28px',
                  }}
                />

                {/* Center radial warmth */}
                <div className="pointer-events-none absolute inset-0">
                  <div className="absolute left-1/2 top-1/2 h-40 w-40 -translate-x-1/2 -translate-y-1/2 rounded-full blur-[60px]"
                    style={{ background: 'rgba(184,159,122,0.06)' }} />
                </div>

                <div className="relative z-10 flex flex-col items-center text-center">
                  {/* ECG heartbeat line */}
                  <div className="mb-5 h-8 w-32 overflow-hidden opacity-30">
                    <svg viewBox="0 0 120 30" fill="none" className="h-full w-full">
                      <path
                        d="M0 15 L20 15 L25 15 L30 5 L35 25 L40 10 L45 20 L50 15 L70 15 L75 15 L80 5 L85 25 L90 10 L95 20 L100 15 L120 15"
                        stroke="#d4c4a8" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round"
                        style={{ strokeDasharray: '200', strokeDashoffset: '200', animation: 'ecg-draw 3s ease-in-out infinite' }}
                      />
                    </svg>
                  </div>

                  <div className={`mb-6 flex h-16 w-16 items-center justify-center rounded-full border transition-all duration-500 ${
                    isDragging
                      ? 'border-warm-400/30 bg-warm-400/10 shadow-lg shadow-warm-400/5'
                      : 'border-warm-200/[0.06] bg-warm-200/[0.02]'
                  }`}>
                    <I.Upload className={`h-6 w-6 transition-colors duration-300 ${isDragging ? 'text-warm-400' : 'text-warm-300/20'}`} strokeWidth={1.2} />
                  </div>

                  <p className="mb-1.5 text-[13px] font-medium text-warm-200/50">
                    {isDragging ? 'Release to analyze' : 'Drop chest X-ray here'}
                  </p>
                  <p className="mb-6 text-[12px] text-warm-300/20">
                    {isDragging ? '' : 'or click to browse'}
                  </p>

                  <div className="flex items-center gap-2">
                    <span className="rounded-full bg-warm-200/[0.04] px-2.5 py-0.5 text-[10px] font-medium text-warm-300/25">JPG</span>
                    <span className="rounded-full bg-warm-200/[0.04] px-2.5 py-0.5 text-[10px] font-medium text-warm-300/25">PNG</span>
                    <span className="text-[10px] text-warm-300/10">•</span>
                    <span className="text-[10px] text-warm-300/15">max 10 MB</span>
                  </div>
                </div>

                <input ref={fileInputRef} type="file" accept=".jpg,.jpeg,.png" className="hidden" onChange={onInput} />
              </div>
            </div>
          </div>
        );
      }

      /* ──────────────────────────────────────────────────────────────
         PROCESSING
         ────────────────────────────────────────────────────────────── */
      function ProcessingOverlay({ previewUrl }) {
        return (
          <div className="fade-up relative overflow-hidden rounded-[24px]">
            <img src={previewUrl} alt="X-ray preview" className="h-[340px] w-full object-cover sm:h-[380px]" />
            <div className="absolute inset-0 bg-warm-950/70 backdrop-blur-[2px]" />

            <div className="absolute inset-0 overflow-hidden">
              <div className="scan-line absolute left-0 h-[1px] w-full"
                style={{
                  background: 'linear-gradient(90deg, transparent, rgba(212,196,168,0.0) 20%, rgba(212,196,168,0.6) 50%, rgba(212,196,168,0.0) 80%, transparent)',
                  boxShadow: '0 0 24px rgba(184,159,122,0.2)',
                }}
              />
            </div>

            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <div className="relative mb-6">
                <svg className="h-16 w-16" viewBox="0 0 64 64">
                  <circle cx="32" cy="32" r="28" fill="none" stroke="rgba(212,196,168,0.06)" strokeWidth="1.5" />
                  <circle cx="32" cy="32" r="28" fill="none"
                    stroke="url(#warm-grad)" strokeWidth="1.5" strokeLinecap="round"
                    strokeDasharray="110 60"
                    style={{ animation: 'ring-spin 1.8s linear infinite', transformOrigin: 'center' }}
                  />
                  <defs>
                    <linearGradient id="warm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stopColor="#d4c4a8" />
                      <stop offset="100%" stopColor="#8b7050" />
                    </linearGradient>
                  </defs>
                </svg>
                <div className="absolute inset-0 flex items-center justify-center">
                  <I.Brain className="h-6 w-6 text-warm-400/70" style={{ animation: 'pulse-warm 2s ease-in-out infinite' }} />
                </div>
              </div>

              <p className="mb-1 text-[13px] font-medium text-warm-200/80">Analyzing image</p>
              <p className="text-[12px] text-warm-300/25">Running neural network inference</p>

              <div className="mt-5 flex gap-1.5">
                {[0, 1, 2].map((i) => (
                  <div key={i} className="h-[3px] w-[3px] rounded-full bg-warm-400/50"
                    style={{ animation: `pulse-warm 1.4s ease-in-out ${i * 0.2}s infinite` }} />
                ))}
              </div>
            </div>
          </div>
        );
      }

      /* ──────────────────────────────────────────────────────────────
         RESULT
         ────────────────────────────────────────────────────────────── */
      function ResultView({ previewUrl, result, onReset }) {
        const isNormal = result.label === 'Normal';
        return (
          <div className="fade-up relative overflow-hidden rounded-[24px]">
            <img src={previewUrl} alt="Analyzed X-ray" className="h-[340px] w-full object-cover sm:h-[380px]" />
            <div className="absolute inset-0"
              style={{ background: 'linear-gradient(to top, rgba(15,13,11,0.9) 0%, rgba(15,13,11,0.35) 45%, transparent 75%)' }} />

            <div className="absolute right-4 top-4">
              <div className={`inline-flex items-center gap-2 rounded-full px-3.5 py-1.5 backdrop-blur-xl ${
                isNormal
                  ? 'bg-emerald-500/[0.08] border border-emerald-500/[0.15]'
                  : 'bg-red-400/[0.08] border border-red-400/[0.15]'
              }`}>
                {isNormal
                  ? <I.Check className="h-3.5 w-3.5 text-emerald-400/80" />
                  : <I.X className="h-3.5 w-3.5 text-red-400/80" />
                }
                <span className={`text-[12px] font-semibold ${isNormal ? 'text-emerald-300/90' : 'text-red-300/90'}`}>
                  {result.label}
                </span>
              </div>
            </div>

            <div className="absolute bottom-0 left-0 right-0 p-5">
              <div className="flex items-end justify-between">
                <div>
                  <p className="mb-0.5 text-[10px] font-semibold uppercase tracking-[0.12em] text-warm-300/25">Confidence</p>
                  <p className="text-[28px] font-bold tracking-tight text-warm-100">{result.confidence}</p>
                  {result.inferenceTime && (
                    <p className="mt-1 text-[11px] text-warm-300/20">{result.inferenceTime}ms inference</p>
                  )}
                </div>
                <button onClick={(e) => { e.stopPropagation(); onReset(); }}
                  className="flex items-center gap-2 rounded-xl border border-warm-200/[0.06] bg-warm-200/[0.03] px-4 py-2 text-[12px] font-medium text-warm-300/40 backdrop-blur-xl transition-all hover:border-warm-200/[0.12] hover:bg-warm-200/[0.06] hover:text-warm-200/70">
                  <I.RotateCcw className="h-3.5 w-3.5" />
                  New scan
                </button>
              </div>
              <div className="mt-4">
                <div className="h-[3px] w-full overflow-hidden rounded-full bg-warm-200/[0.04]">
                  <div className="h-full rounded-full transition-all duration-[1200ms] ease-out"
                    style={{
                      width: result.confidence,
                      background: isNormal
                        ? 'linear-gradient(90deg, #4d7c5e, #7ab88a)'
                        : 'linear-gradient(90deg, #b85c4a, #d48a6a)',
                    }} />
                </div>
              </div>
            </div>
          </div>
        );
      }

      /* ──────────────────────────────────────────────────────────────
         FEATURE CARD
         ────────────────────────────────────────────────────────────── */
      function FeatureCard({ icon: Icon, title, description }) {
        return (
          <div className="group rounded-[20px] bg-warm-200/[0.02] p-6 transition-all duration-300 hover:bg-warm-200/[0.04]">
            <div className="mb-4 inline-flex h-10 w-10 items-center justify-center rounded-2xl bg-warm-400/[0.06]">
              <Icon className="h-[18px] w-[18px] text-warm-400/40" strokeWidth={1.2} />
            </div>
            <h3 className="mb-2 text-[14px] font-semibold text-warm-200/80">{title}</h3>
            <p className="text-[13px] leading-[1.65] text-warm-300/28">{description}</p>
          </div>
        );
      }

      /* ──────────────────────────────────────────────────────────────
         APP
         ────────────────────────────────────────────────────────────── */
      function App() {
        const [state, setState] = useState('upload');
        const [previewUrl, setPreviewUrl] = useState(null);
        const [result, setResult] = useState(null);
        const [error, setError] = useState(null);
        const API_URL = 'http://127.0.0.1:8000';

        const handleFileSelect = useCallback(async (file) => {
          const url = URL.createObjectURL(file);
          setPreviewUrl(url);
          setState('processing');
          setError(null);
          try {
            const fd = new FormData();
            fd.append('file', file);
            const res = await fetch(`${API_URL}/predict`, { method: 'POST', body: fd });
            if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || `Error ${res.status}`); }
            const d = await res.json();
            setResult({ label: d.label, confidence: d.confidence, inferenceTime: d.inference_time_ms });
            setState('result');
          } catch (err) {
            setError(err.message || 'Could not reach backend.');
            setState('upload');
          }
        }, []);

        const handleReset = useCallback(() => { setState('upload'); setPreviewUrl(null); setResult(null); }, []);

        return (
          <div className="relative min-h-screen bg-warm-950">
            <Navbar />

            {error && (
              <div className="fixed left-1/2 top-20 z-50 -translate-x-1/2">
                <div className="flex items-center gap-3 rounded-2xl border border-red-400/[0.1] bg-warm-950/95 px-5 py-3 text-[13px] text-red-300/70 backdrop-blur-xl shadow-2xl">
                  <span className="text-red-400/50">⚠</span>
                  <span>{error}</span>
                  <button onClick={() => setError(null)} className="ml-3 text-warm-300/20 hover:text-warm-300/40">✕</button>
                </div>
              </div>
            )}

            {/* Warm ambient background */}
            <div className="pointer-events-none fixed inset-0 overflow-hidden">
              <div className="absolute -right-[300px] -top-[200px] h-[800px] w-[800px] rounded-full"
                style={{ background: 'radial-gradient(circle, rgba(184,159,122,0.03), transparent 60%)' }} />
              <div className="absolute -left-[200px] top-1/3 h-[600px] w-[600px] rounded-full"
                style={{ background: 'radial-gradient(circle, rgba(139,112,80,0.02), transparent 60%)' }} />
            </div>

            {/* ═══ HERO ═══ */}
            <main className="relative z-10 mx-auto max-w-6xl px-8 pt-32 pb-28 md:pt-36">
              <div className="grid items-center gap-20 lg:grid-cols-[1fr_1.15fr] lg:gap-24">

                {/* Left */}
                <div className="flex flex-col gap-8">
                  <div className="flex items-center gap-3">
                    <div className="h-px w-10 bg-gradient-to-r from-warm-400/40 to-transparent" />
                    <span className="text-[11px] font-semibold uppercase tracking-[0.2em] text-warm-400/35">AI-Powered Diagnostics</span>
                  </div>

                  <div className="flex flex-col">
                    <h1 className="text-[clamp(2.5rem,5.5vw,4rem)] font-bold leading-[1.02] tracking-[-0.035em] text-warm-100">
                      A sanctuary for
                    </h1>
                    <h1 className="text-[clamp(2.5rem,5.5vw,4rem)] font-bold leading-[1.02] tracking-[-0.035em]">
                      <span className="font-serif italic font-medium text-warm-400"
                        style={{
                          backgroundImage: 'linear-gradient(135deg, #d4c4a8 0%, #b89f7a 40%, #a08560 70%, #8b7050 100%)',
                          WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', backgroundClip: 'text',
                        }}>
                        pulmonary health
                      </span>
                    </h1>
                    <h1 className="text-[clamp(2.5rem,5.5vw,4rem)] font-bold leading-[1.02] tracking-[-0.035em] text-warm-100">
                      powered by AI.
                    </h1>
                  </div>

                  <p className="max-w-[440px] text-[15px] leading-[1.8] text-warm-300/30">
                    A CNN trained on PneumoniaMNIST — 7,114 chest X-rays across
                    three clinical splits. Real inference, real weights, no synthetic data.
                  </p>

                  <div className="flex flex-wrap gap-3">
                    <StatPill icon={I.Search} label="Dataset" value="7,114" />
                    <StatPill icon={I.Brain} label="Params" value="105K" />
                    <StatPill icon={I.Zap} label="Input" value="34×34 px" />
                  </div>

                  <div className="flex items-center gap-5 pt-2">
                    <button onClick={() => document.querySelector('#upload-zone')?.scrollIntoView({ behavior: 'smooth' })}
                      className="group flex items-center gap-2.5 rounded-full bg-warm-200 px-6 py-3 text-[13px] font-semibold text-warm-950 transition-all hover:bg-warm-100 hover:shadow-lg hover:shadow-warm-200/5">
                      Get Started
                      <I.ArrowRight className="h-3.5 w-3.5 transition-transform group-hover:translate-x-0.5" />
                    </button>
                    <a href="#" className="flex items-center gap-1 text-[13px] font-medium text-warm-300/25 transition-colors hover:text-warm-300/50">
                      Docs <I.ChevronRight className="h-3 w-3" />
                    </a>
                  </div>
                </div>

                {/* Right — Upload + Anatomy illustration */}
                <div id="upload-zone" className="relative flex justify-center lg:justify-end">
                  {/* Organic anatomy illustration behind upload zone */}
                  <AnatomyDecor className="pointer-events-none absolute -left-16 top-1/2 -translate-y-1/2 h-[500px] w-[400px] opacity-60" />

                  <div className="relative z-10 w-full max-w-[420px]">
                    {state === 'upload' && <UploadZone onFileSelect={handleFileSelect} />}
                    {state === 'processing' && <ProcessingOverlay previewUrl={previewUrl} />}
                    {state === 'result' && <ResultView previewUrl={previewUrl} result={result} onReset={handleReset} />}
                  </div>
                </div>
              </div>

              {/* ═══ FEATURES ═══ */}
              <div className="mt-32 grid gap-4 sm:grid-cols-3">
                <FeatureCard icon={I.Brain} title="Custom CNN"
                  description="2-layer convolutional network with 105,281 parameters. Trained for 10 epochs with Adam optimizer (lr=1e-3)." />
                <FeatureCard icon={I.Zap} title="PneumoniaMNIST"
                  description="5,856 training, 634 validation, 624 test images. 28×28 grayscale chest X-rays, resized to 34×34 for inference." />
                <FeatureCard icon={I.FileImage} title="Binary Classification"
                  description="BCEWithLogitsLoss, dropout 0.5, class-imbalanced dataset (~73% pneumonia, ~27% normal)." />
              </div>
            </main>

            {/* ═══ FOOTER ═══ */}
            <footer className="relative z-10 border-t border-warm-200/[0.03]">
              <div className="mx-auto flex max-w-6xl items-center justify-between px-8 py-6">
                <p className="text-[12px] text-warm-300/15">
                  © 2026 PneumoAI. For research and clinical decision support only.
                </p>
                <div className="flex items-center gap-6">
                  <a href="#" className="text-[12px] text-warm-300/15 transition-colors hover:text-warm-300/30">Privacy</a>
                  <a href="#" className="text-[12px] text-warm-300/15 transition-colors hover:text-warm-300/30">Terms</a>
                </div>
              </div>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
  </body>
</html>
